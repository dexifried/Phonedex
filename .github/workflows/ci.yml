name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python SIP and controller tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline Python tests
        run: python -m unittest test_agent_controller test_harness_live_adapter test_sip_teardown test_onboarding test_barge_in test_agentphone_transcripts test_voicemail
      - name: Release secret and file audit
        run: python scripts/release_audit.py

  worker:
    name: Cloudflare Worker route tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline Worker tests
        run: node worker/test-agent.mjs
