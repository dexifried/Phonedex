  <title id="title">PhoneDex</title>
  <desc id="desc">An electric blue and violet call-loop with an audio pulse on a midnight field.</desc>
  <defs>
    <linearGradient id="accent" x1=".12" y1=".12" x2=".88" y2=".88">
      <stop offset="0" stop-color="#56c8ff"/>
