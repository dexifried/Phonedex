      <stop offset="1" stop-color="#a276ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#273d85" stop-opacity=".58"/>
      <stop offset="1" stop-color="#090d1c" stop-opacity="0"/>
